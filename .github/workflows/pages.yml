# The leaderboard site (site/ on GitHub Pages): every entry under leaderboards/ is checked and merged into
# site/leaderboard.json; the page itself is static (no build, no backend).
name: Leaderboard site

on:
  push:
    branches: [main]
    paths: ["leaderboards/**", "site/**", "src/relaymcp/play/arena.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: relaymcp arena render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
