name: CI

on:
  push:
    branches: [main, perf]
  pull_request:
  workflow_dispatch:

# One run per commit: a push and a pull request for the same commit don't both use runner minutes.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests scripts
      - name: Parse the setup script template (PowerShell)
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/src/relaymcp/device/setup/Relay-Setup.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.9"}     # macOS's own /usr/bin/python3 is 3.9
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest
      - run: uv run --no-sync relaymcp --help

  windows-kit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - name: Build a real kit
        run: uv run --no-sync python scripts/ci_kit_smoke.py "$env:RUNNER_TEMP\kit"
      - name: Parse the rendered Relay-Setup.ps1 with Windows PowerShell 5.1 (the handheld's shell)
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:RUNNER_TEMP\kit\Relay-Setup.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          # Evaluate the host label exactly as the handheld will (BOM-marked UTF-8, typographic apostrophe escaped).
          $line = Get-Content "$env:RUNNER_TEMP\kit\Relay-Setup.ps1" | Where-Object { $_ -match '^\$HostLabel\s*=' } | Select-Object -First 1
          Invoke-Expression $line
          $expected = "the CI runner$([char]0x2019)s PC"
          if ($HostLabel -ne $expected) { throw "host label mangled: [$HostLabel]" }
          'parsed OK; host label intact'
      - name: Install the ViGEmBus driver silently from the kit (as setup does, before the runtime)
        timeout-minutes: 5
        shell: powershell
        run: |
          $msi = "$env:RUNNER_TEMP\kit\ViGEmBusSetup_x64.msi"
          $sig = Get-AuthenticodeSignature -FilePath $msi
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Nefarius') { throw "bad signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\vigembus.log`"" -Wait -PassThru
          "msiexec exit code: $($p.ExitCode)"
          $registered = [bool](Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Nefarius Virtual Gamepad Emulation Bus Driver*' })
          if (-not $registered) { Get-Content "$env:RUNNER_TEMP\vigembus.log" -Tail 30; throw 'ViGEmBus is not registered after the silent install' }
          'ViGEmBus installed and registered'
      - name: Install the device runtime from the kit (as the handheld does)
        timeout-minutes: 10
        run: |
          Expand-Archive "$env:RUNNER_TEMP\kit\relaymcp-device.zip" "$env:RUNNER_TEMP\device"
          uv venv --python 3.12 "$env:RUNNER_TEMP\devenv"
          uv pip install --python "$env:RUNNER_TEMP\devenv\Scripts\python.exe" "$env:RUNNER_TEMP\device"
      - name: Import the device modules and build the hardware MCP server
        timeout-minutes: 5
        run: '& "$env:RUNNER_TEMP\devenv\Scripts\python.exe" -u scripts/ci_device_smoke.py'
      - name: Device tests on the runner's desktop (focus, virtual gamepad, capture)
        timeout-minutes: 5
        env:
          RELAYMCP_DEVICE_TESTS: "1"
        run: |
          uv pip install --python "$env:RUNNER_TEMP\devenv\Scripts\python.exe" pytest
          & "$env:RUNNER_TEMP\devenv\Scripts\python.exe" -m pytest tests/device tests/test_capture.py -q -rs -s -p no:cacheprovider
